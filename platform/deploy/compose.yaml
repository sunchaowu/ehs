services:
  proxy:
    restart: unless-stopped
    image: caddy:2
    networks:
      - edge
      - system
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
  portal:
    restart: unless-stopped
    image: enterprise-platform-portal
    networks:
      - system
  control-plane:
    restart: unless-stopped
    image: enterprise-platform-control-plane
    networks:
      - system
  system-db:
    restart: unless-stopped
    image: postgres:16
    networks:
      - system
    volumes:
      - system-db-data:/var/lib/postgresql/data

volumes:
  system-db-data: {}

networks:
  edge: {}
  system: {}
  test:
    internal: true
  prod:
    internal: true
